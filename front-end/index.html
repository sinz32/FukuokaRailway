<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 열차 위치 (후쿠오카)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. AppBar Header -->
  <header class="app-bar">
    <div class="title" id="app-title">실시간 열차 위치 (후쿠오카)</div>
    <button class="icon-btn" id="btn-open-drawer" aria-label="메뉴 열기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <!-- 2. Drawer Side Navigation -->
  <div class="overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer-menu">
    <div class="drawer-header">
      <h2>노선 목록</h2>
      <button class="icon-btn" id="btn-close-drawer-top" aria-label="닫기">✕</button>
    </div>
    <ul class="drawer-menu">
      <li><button data-line="A">지하철 공항선</button></li>
      <li><button data-line="H">지하철 하코자기선</button></li>
      <li><button data-line="N">지하철 나나쿠마선</button></li>
      <li><button data-line="T">니시테츠 텐진오무타선</button></li>
      <li><button data-line="D">니시테츠 다자이후선</button></li>
    </ul>
    <div class="drawer-footer">
      <button class="btn-close-drawer" id="btn-close-drawer">닫기</button>
    </div>
  </aside>

  <!-- 3. Main Content Container -->
  <main class="main-container">

    <!-- 3-1. Home View (Button Grid) -->
    <section id="home-view" style="display: block;">
      <div class="home-grid">
        <button class="btn-card" data-line="A">지하철 공항선</button>
        <button class="btn-card" data-line="H">지하철 하코자기선</button>
        <button class="btn-card" data-line="N">지하철 나나쿠마선</button>
        <button class="btn-card" data-line="T">니시테츠 텐진오무타선</button>
        <button class="btn-card" data-line="D">니시테츠 다자이후선</button>
        <button class="btn-card" id="btn-site-info">웹사이트 정보</button>
      </div>
    </section>

    <!-- 3-2. Real-Time Line View -->
    <section id="line-view" style="display: none;">
      <div class="line-header-bar">
        <span class="line-title" id="selected-line-title"></span>
      </div>

      <!-- 3분 미입력 시 정지 안내 메시지 -->
      <div id="inactive-banner" class="inactive-banner" style="display: none;">
        3분 동안 화면 터치가 없어 실시간 정보 갱신이 멈추었습니다. 화면을 터치하시면 다시 갱신됩니다.
      </div>

      <div class="table-container" id="table-container">
        <table class="train-table">
          <thead>
            <tr>
              <th class="col-up">▲ 상행</th>
              <th class="col-stn">역명</th>
              <th class="col-down">▼ 하행</th>
            </tr>
          </thead>
          <tbody id="station-table-body">
            <!-- Dynamic Content via JS -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 3-3. Website Info View -->
    <section id="site-info-view" style="display: none;">
      <div class="info-card">
        <p class="info-text">
          일본 후쿠오카 지역의 일부 철도 노선들의 실시간 열차 위치를 확인할 수 있습니다. 이 사이트는 개인이 운영하는 곳으로, 철도 운영 회사 및 기관과는 전혀 관련이 없습니다.
        </p>
        <button class="btn-home" id="btn-back-home">메인화면으로 돌아가기</button>
      </div>
    </section>

  </main>

  <!-- 4. Global Footer (항상 최하단 배치) -->
  <footer class="global-footer">
    © 2026 SinZ, All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
